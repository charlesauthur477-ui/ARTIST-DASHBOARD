<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline | Wavelength</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0b0a09;
        color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 360px; }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
      p { font-size: 0.95rem; color: #a8a29e; margin: 0 0 20px; line-height: 1.5; }
      button {
        appearance: none;
        border: 1px solid #44403c;
        background: #1c1917;
        color: #f5f5f4;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 500;
        min-height: 44px;
        min-width: 44px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Reconnect to continue. Your bookings, calendar, and portal data are not stored on this device.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
